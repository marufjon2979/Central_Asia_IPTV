name: Update EPG

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout IPTV repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download EPG engine
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git epg-engine
          cd epg-engine
          npm install

      - name: Generate Russian EPG
        run: |
          cd epg-engine
          npm run grab -- --sites=example.com --output=../epg.xml

      - name: Save EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml
          git diff --cached --quiet || git commit -m "Update EPG"
          git push
